  <script>
   function toggleAnimation() {
   const animatedElements = document.getElementsByClassName('animated');
   for (let i = 0; i < animatedElements.length; i++) {
    const element = animatedElements[i];
    element.style.animationPlayState = 
      element.style.animationPlayState === 'paused' ? 'running' : 'paused';
    }
   }
  </script>
  <style>

   font-family: 'Halo Dek';

   }
   #bunny{
    animation: bunny 1.5s infinite step-start;
    animation-play-state: running;
   }
   @keyframes bunny {
    0% {transform: rotate(0deg)}
    25% {transform: rotate(15deg)}
    50% {transform: rotate(0deg)}
    75% {transform: rotate(-15deg)}
    100% {transform: rotate(0deg)}
   }

    animation-play-state: running;
   }
   @keyframes kitty {
    0% {transform: rotate(0deg)}
    25% {transform: rotate(-10deg)}
    50% {transform: rotate(0deg)}
    75% {transform: rotate(10deg)}
    100% {transform: rotate(0deg)}
